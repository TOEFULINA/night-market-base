name: Deploy to GitHub Pages

# Builds the Vite site and publishes it to GitHub Pages on every push to
# main. No separate hosting account needed - this runs on GitHub's own
# infrastructure (free, unlimited minutes on a public repo) and serves the
# built site straight from GitHub. vite.config.js already uses a relative
# base ('./'), which is what makes the built asset paths work correctly
# under the /night-market-base/ subpath GitHub Pages serves project sites
# from.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you manually re-run a deploy from the Actions tab without needing a new push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
